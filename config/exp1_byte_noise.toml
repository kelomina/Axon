# 实验1: 仅启用字节噪声增强
# 目标：模拟加壳/混淆/多态变异，修复中等置信度错误
# 预期 F1 提升：0.15-0.20%

[experiment]
name = "axon_v2.6_exp1_byte_noise"
seed = 42

[model]
max_byte_length = 512
byte_embedding_dim = 128
dsra_dim = 160
dsra_heads = 4
dsra_slots = 160
dsra_read_topk = 12
dsra_write_topk = 4
dsra_local_window = 384
dsra_chunk_size = 512
pe_feature_dim = 256
pe_projection_dim = 160
pe_projector_hidden_dim = 384
classifier_hidden_dim = 96
fusion_type = "concat"
dropout = 0.15

[training]
optimizer = "adamw"
learning_rate = 0.00008
weight_decay = 0.00005
lr_scheduler = "cosine"
warmup_epochs = 3
warmup_start_lr = 0.000001
min_lr = 0.000001
max_epochs = 50
early_stopping_patience = 5
early_stopping_min_delta = 0.0003
gradient_clip = 0.75
mixed_precision = false
batch_size = 16
pin_memory = true
decision_threshold = 0.50
label_smoothing = 0.03
focal_gamma = 1.0
focal_alpha = 0.55
diversity_loss_weight = 0.03
enable_swanlab = false

[data]
data_dir = "data"
cache_dir = "data/.cache"
output_dir = "models/exp1_byte_noise"
log_dir = "reports/logs/exp1_byte_noise"
val_ratio = 0.04
test_ratio = 0.8
strict_pe_parsing = true
allow_pe_fallback = false
pe_schema_version = "fixed_v2"
pe_fixed_section_slots = 32
follow_symlinks = false
allowed_symlink_roots = []
strict_unknown_labels = true
eval_interval = 1
save_best_only = true

[augmentation]
enable = true
byte_dropout = 0.0
byte_noise = 0.02
feature_noise = 0.0

[device]
device = "cuda"
